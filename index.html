<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NinjaFredde's Warehouse</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            overflow: hidden; 
            background: #1a1a1a;
            font-family: 'Courier New', monospace;
        }
        #game-container { 
            width: 100vw; 
            height: 100vh; 
            position: relative;
        }
        canvas { display: block; }
        
        /* Menu overlay */
        #menu {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        #menu h1 {
            color: #f0f0f0;
            font-size: 2.5em;
            margin-bottom: 0.5em;
            text-shadow: 0 0 20px rgba(255,150,50,0.5);
        }
        #menu p {
            color: #888;
            margin-bottom: 2em;
            font-size: 0.9em;
        }
        #menu button {
            background: #333;
            border: 2px solid #666;
            color: #f0f0f0;
            padding: 15px 40px;
            margin: 10px;
            font-size: 1.1em;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
        }
        #menu button:hover {
            background: #444;
            border-color: #f80;
            box-shadow: 0 0 20px rgba(255,136,0,0.3);
        }
        
        /* Narrator box */
        #narrator {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            border: 1px solid #555;
            padding: 20px 40px;
            max-width: 600px;
            color: #f0f0f0;
            font-size: 1.1em;
            line-height: 1.5;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 50;
        }
        #narrator.visible { 
            opacity: 1; 
            pointer-events: auto;
        }
        #narrator .speaker {
            color: #f80;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        /* Crosshair */
        #crosshair {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 20px; height: 20px;
            border: 2px solid rgba(255,255,255,0.5);
            border-radius: 50%;
            pointer-events: none;
            z-index: 10;
        }
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255,255,255,0.5);
        }
        #crosshair::before {
            width: 2px; height: 6px;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
        }
        #crosshair::after {
            width: 6px; height: 2px;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
        }
        
        /* Instructions */
        #instructions {
            position: absolute;
            top: 20px; left: 20px;
            color: #666;
            font-size: 0.8em;
            z-index: 10;
        }
        
        /* Hidden when playing */
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="game-container">
        <!-- Menu -->
        <div id="menu">
            <h1>📦 The Warehouse</h1>
            <p>A collection of game development artifacts</p>
            <button onclick="startGame('tour')">🚂 Take the Tour</button>
            <button onclick="startGame('freeroam')">🚶 Free Roam</button>
        </div>
        
        <!-- HUD -->
        <div id="crosshair" class="hidden"></div>
        <div id="instructions" class="hidden">
            WASD - Move | Mouse - Look | ESC - Menu
        </div>
        
        <!-- Narrator -->
        <div id="narrator">
            <div class="speaker">CURATOR</div>
            <div class="text"></div>
        </div>
    </div>

    <!-- Three.js -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <!-- Rapier Physics (WASM) -->
    <script src="https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.12.0/rapier.min.js"></script>
    
    <script>
    // ============================================
    // GAME STATE
    // ============================================
    const state = {
        mode: null, // 'tour' or 'freeroam'
        playing: false,
        physics: null,
        bodies: [],
        narrator: {
            queue: [],
            current: null,
            timeout: null
        }
    };

    // ============================================
    // THREE.JS SETUP
    // ============================================
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a1a);
    scene.fog = new THREE.Fog(0x1a1a1a, 10, 50);
    
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.7, 8);
    
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.getElementById('game-container').appendChild(renderer.domElement);

    // ============================================
    // LIGHTING
    // ============================================
    const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
    scene.add(ambientLight);

    // Main overhead lights
    const lights = [];
    for (let x = -8; x <= 8; x += 8) {
        const light = new THREE.SpotLight(0xffeedd, 50);
        light.position.set(x, 8, 0);
        light.angle = 0.6;
        light.penumbra = 0.5;
        light.castShadow = true;
        light.shadow.mapSize.width = 512;
        light.shadow.mapSize.height = 512;
        scene.add(light);
        lights.push(light);
    }

    // ============================================
    // WAREHOUSE GEOMETRY
    // ============================================
    const floorGeom = new THREE.PlaneGeometry(30, 30);
    const floorMat = new THREE.MeshStandardMaterial({ 
        color: 0x3a3a3a,
        roughness: 0.9
    });
    const floor = new THREE.Mesh(floorGeom, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    // Walls
    const wallMat = new THREE.MeshStandardMaterial({ color: 0x4a4a4a, roughness: 0.8 });
    const wallHeight = 10;
    const wallGeom = new THREE.PlaneGeometry(30, wallHeight);
    
    // Back wall
    const backWall = new THREE.Mesh(wallGeom, wallMat);
    backWall.position.set(0, wallHeight/2, -15);
    scene.add(backWall);
    
    // Side walls
    const leftWall = new THREE.Mesh(wallGeom, wallMat);
    leftWall.position.set(-15, wallHeight/2, 0);
    leftWall.rotation.y = Math.PI / 2;
    scene.add(leftWall);
    
    const rightWall = new THREE.Mesh(wallGeom, wallMat);
    rightWall.position.set(15, wallHeight/2, 0);
    rightWall.rotation.y = -Math.PI / 2;
    scene.add(rightWall);

    // ============================================
    // ARTIFACTS & CRATES
    // ============================================
    const artifacts = [];
    const crates = [];

    function createCrate(x, y, z, size = 1, color = 0x8B4513) {
        const geom = new THREE.BoxGeometry(size, size, size);
        const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.7 });
        const mesh = new THREE.Mesh(geom, mat);
        mesh.position.set(x, y, z);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        scene.add(mesh);
        crates.push({ mesh, size });
        return mesh;
    }

    function createArtifact(x, y, z, name, description, color = 0xff6600) {
        // Pedestal
        const pedestalGeom = new THREE.CylinderGeometry(0.5, 0.6, 0.3, 16);
        const pedestalMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
        const pedestal = new THREE.Mesh(pedestalGeom, pedestalMat);
        pedestal.position.set(x, 0.15, z);
        pedestal.castShadow = true;
        scene.add(pedestal);
        
        // The artifact (placeholder cube for now)
        const artifactGeom = new THREE.BoxGeometry(0.6, 0.6, 0.6);
        const artifactMat = new THREE.MeshStandardMaterial({ 
            color, 
            metalness: 0.3,
            roughness: 0.4,
            emissive: color,
            emissiveIntensity: 0.1
        });
        const artifact = new THREE.Mesh(artifactGeom, artifactMat);
        artifact.position.set(x, y, z);
        artifact.castShadow = true;
        artifact.userData = { name, description, isArtifact: true };
        scene.add(artifact);
        
        artifacts.push(artifact);
        return artifact;
    }

    // Shelving units
    function createShelf(x, z) {
        const shelfMat = new THREE.MeshStandardMaterial({ color: 0x5c4033 });
        
        // Vertical posts
        for (let px of [-1, 1]) {
            const post = new THREE.Mesh(
                new THREE.BoxGeometry(0.1, 3, 0.1),
                shelfMat
            );
            post.position.set(x + px, 1.5, z);
            post.castShadow = true;
            scene.add(post);
        }
        
        // Shelves
        for (let sy of [0.5, 1.5, 2.5]) {
            const shelf = new THREE.Mesh(
                new THREE.BoxGeometry(2.2, 0.05, 0.8),
                shelfMat
            );
            shelf.position.set(x, sy, z);
            shelf.castShadow = true;
            shelf.receiveShadow = true;
            scene.add(shelf);
        }
    }

    // Place shelves
    createShelf(-8, -10);
    createShelf(-4, -10);
    createShelf(4, -10);
    createShelf(8, -10);

    // Place crates (some stacked, some scattered)
    createCrate(-10, 0.5, 5, 1);
    createCrate(-10, 1.5, 5, 0.8);
    createCrate(-10, 2.2, 5, 0.6);  // Precarious stack!
    createCrate(-9, 0.5, 6, 1);
    createCrate(-11, 0.5, 4, 1.2);

    createCrate(10, 0.5, -5, 1);
    createCrate(11, 0.5, -4, 0.8);
    createCrate(9, 0.5, -6, 1.1);

    // Place artifacts
    createArtifact(0, 1, -5, "C64 Palette Shader", 
        "A popular Godot shader that remaps colors to the classic Commodore 64 palette. Over 500 downloads!", 0x4488ff);
    createArtifact(-5, 1, 0, "Muscle Car Model", 
        "A 1969 Mustang from an unreleased racing prototype. The physics were too realistic.", 0xff4444);
    createArtifact(5, 1, 0, "Pixel Knight", 
        "Main character from a platformer that never shipped. He still waits for his adventure.", 0x44ff44);
    createArtifact(0, 1, 5, "Mystery Box", 
        "Even I don't know what's in here. Some prototypes are best left forgotten...", 0x888888);

    // ============================================
    // FIRST PERSON CONTROLS
    // ============================================
    const movement = { forward: 0, right: 0 };
    const euler = new THREE.Euler(0, 0, 0, 'YXZ');
    let isLocked = false;

    document.addEventListener('keydown', (e) => {
        if (!state.playing) return;
        switch(e.code) {
            case 'KeyW': movement.forward = 1; break;
            case 'KeyS': movement.forward = -1; break;
            case 'KeyA': movement.right = -1; break;
            case 'KeyD': movement.right = 1; break;
            case 'Escape': exitGame(); break;
        }
    });

    document.addEventListener('keyup', (e) => {
        switch(e.code) {
            case 'KeyW': case 'KeyS': movement.forward = 0; break;
            case 'KeyA': case 'KeyD': movement.right = 0; break;
        }
    });

    document.addEventListener('mousemove', (e) => {
        if (!isLocked || !state.playing) return;
        
        euler.setFromQuaternion(camera.quaternion);
        euler.y -= e.movementX * 0.002;
        euler.x -= e.movementY * 0.002;
        euler.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, euler.x));
        camera.quaternion.setFromEuler(euler);
    });

    document.addEventListener('pointerlockchange', () => {
        isLocked = document.pointerLockElement === renderer.domElement;
    });

    renderer.domElement.addEventListener('click', () => {
        if (state.playing && state.mode === 'freeroam') {
            renderer.domElement.requestPointerLock();
        }
    });

    // ============================================
    // NARRATOR SYSTEM
    // ============================================
    const narratorEl = document.getElementById('narrator');
    const narratorText = narratorEl.querySelector('.text');

    const narratorLines = {
        welcome: "Ah, welcome! Welcome to the warehouse. Mind your step – some of these prototypes are... temperamental.",
        tour_start: "Let me show you around. We have quite the collection here.",
        crate_bump: ["Careful there!", "Oh! Those are fragile... well, not really.", "I was going to reorganize those anyway.", "That's coming out of your deposit."],
        artifact_c64: "Ah, the C64 Palette Shader! A labor of love for the retro enthusiast. Godot developers seem to enjoy it.",
        artifact_car: "The Muscle Car. Beautiful, isn't she? The handling was too realistic – players kept crashing.",
        artifact_knight: "Sir Pixel, the knight who never got his quest. Perhaps someday...",
        artifact_mystery: "I wouldn't touch that one if I were you. Some code is best left uncompiled.",
        freeroam_intro: "Feel free to explore. Touch whatever you like. I'll be watching.",
    };

    function narrate(key, immediate = false) {
        let text = narratorLines[key];
        if (Array.isArray(text)) {
            text = text[Math.floor(Math.random() * text.length)];
        }
        if (!text) return;
        
        if (immediate) {
            showNarration(text);
        } else {
            state.narrator.queue.push(text);
            processNarratorQueue();
        }
    }

    function showNarration(text) {
        narratorText.textContent = text;
        narratorEl.classList.add('visible');
        
        if (state.narrator.timeout) clearTimeout(state.narrator.timeout);
        state.narrator.timeout = setTimeout(() => {
            narratorEl.classList.remove('visible');
            state.narrator.current = null;
            setTimeout(processNarratorQueue, 500);
        }, 3000 + text.length * 30);
    }

    function processNarratorQueue() {
        if (state.narrator.current || state.narrator.queue.length === 0) return;
        state.narrator.current = state.narrator.queue.shift();
        showNarration(state.narrator.current);
    }

    // ============================================
    // TOUR MODE (Rail camera)
    // ============================================
    const tourPath = [
        { pos: [0, 1.7, 10], look: [0, 1, -5], duration: 2, action: () => narrate('welcome') },
        { pos: [0, 1.7, 3], look: [0, 1, -5], duration: 3, action: () => narrate('artifact_c64') },
        { pos: [-3, 1.7, 0], look: [-5, 1, 0], duration: 3, action: () => narrate('artifact_car') },
        { pos: [3, 1.7, 0], look: [5, 1, 0], duration: 3, action: () => narrate('artifact_knight') },
        { pos: [0, 1.7, 7], look: [0, 1, 5], duration: 3, action: () => narrate('artifact_mystery') },
        { pos: [0, 1.7, 10], look: [0, 1, -5], duration: 2 },
    ];
    let tourIndex = 0;
    let tourProgress = 0;

    function updateTour(delta) {
        if (tourIndex >= tourPath.length - 1) {
            // Tour complete, switch to free roam
            state.mode = 'freeroam';
            narrate('freeroam_intro');
            document.getElementById('instructions').classList.remove('hidden');
            return;
        }
        
        const from = tourPath[tourIndex];
        const to = tourPath[tourIndex + 1];
        
        tourProgress += delta / from.duration;
        
        if (tourProgress >= 1) {
            tourProgress = 0;
            tourIndex++;
            if (tourPath[tourIndex]?.action) {
                tourPath[tourIndex].action();
            }
            return;
        }
        
        // Smooth interpolation
        const t = smoothstep(tourProgress);
        
        camera.position.lerpVectors(
            new THREE.Vector3(...from.pos),
            new THREE.Vector3(...to.pos),
            t
        );
        
        const lookFrom = new THREE.Vector3(...from.look);
        const lookTo = new THREE.Vector3(...to.look);
        const lookTarget = new THREE.Vector3().lerpVectors(lookFrom, lookTo, t);
        camera.lookAt(lookTarget);
    }

    function smoothstep(t) {
        return t * t * (3 - 2 * t);
    }

    // ============================================
    // GAME LOOP
    // ============================================
    const clock = new THREE.Clock();

    function animate() {
        requestAnimationFrame(animate);
        
        const delta = clock.getDelta();
        
        if (state.playing) {
            if (state.mode === 'tour') {
                updateTour(delta);
            } else if (state.mode === 'freeroam') {
                updateFreeroam(delta);
            }
            
            // Rotate artifacts gently
            artifacts.forEach(a => {
                a.rotation.y += delta * 0.5;
            });
        }
        
        renderer.render(scene, camera);
    }

    function updateFreeroam(delta) {
        const speed = 5;
        const direction = new THREE.Vector3();
        
        camera.getWorldDirection(direction);
        direction.y = 0;
        direction.normalize();
        
        const right = new THREE.Vector3();
        right.crossVectors(direction, new THREE.Vector3(0, 1, 0));
        
        camera.position.addScaledVector(direction, movement.forward * speed * delta);
        camera.position.addScaledVector(right, movement.right * speed * delta);
        
        // Keep within bounds
        camera.position.x = Math.max(-14, Math.min(14, camera.position.x));
        camera.position.z = Math.max(-14, Math.min(14, camera.position.z));
        camera.position.y = 1.7;
        
        // Check proximity to artifacts
        checkArtifactProximity();
    }

    let lastNearArtifact = null;
    function checkArtifactProximity() {
        let nearest = null;
        let nearestDist = 3;
        
        for (const artifact of artifacts) {
            const dist = camera.position.distanceTo(artifact.position);
            if (dist < nearestDist) {
                nearest = artifact;
                nearestDist = dist;
            }
        }
        
        if (nearest && nearest !== lastNearArtifact) {
            const key = 'artifact_' + nearest.userData.name.toLowerCase().split(' ')[0];
            if (narratorLines[key]) {
                narrate(key);
            }
            lastNearArtifact = nearest;
        } else if (!nearest) {
            lastNearArtifact = null;
        }
    }

    // ============================================
    // GAME STATE MANAGEMENT
    // ============================================
    function startGame(mode) {
        state.mode = mode;
        state.playing = true;
        
        document.getElementById('menu').classList.add('hidden');
        document.getElementById('crosshair').classList.remove('hidden');
        
        camera.position.set(0, 1.7, 10);
        camera.lookAt(0, 1, -5);
        tourIndex = 0;
        tourProgress = 0;
        
        if (mode === 'tour') {
            narrate('tour_start');
            if (tourPath[0]?.action) tourPath[0].action();
        } else {
            narrate('freeroam_intro');
            document.getElementById('instructions').classList.remove('hidden');
            renderer.domElement.requestPointerLock();
        }
    }

    function exitGame() {
        state.playing = false;
        document.exitPointerLock();
        document.getElementById('menu').classList.remove('hidden');
        document.getElementById('crosshair').classList.add('hidden');
        document.getElementById('instructions').classList.add('hidden');
        narratorEl.classList.remove('visible');
    }

    // ============================================
    // WINDOW RESIZE
    // ============================================
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ============================================
    // START
    // ============================================
    animate();
    </script>
</body>
</html>
